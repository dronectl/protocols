syntax = "proto3";

package raptor.v1;

enum BatteryState {
  BATTERY_STATE_UNSPECIFIED = 0;
  BATTERY_STATE_IDLE = 1;
  BATTERY_STATE_CHARGING = 2;
  BATTERY_STATE_DISCHARGING = 3;
}

message BatteryMeasurements {
  BatteryState state = 1;
  float state_of_charge = 2;
  float voltage = 3;
  float current = 4;
}
