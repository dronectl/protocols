syntax = "proto3";

package raptor.v1;

import "raptor/v1/device.proto";
import "raptor/v1/profile.proto";
import "raptor/v1/registers.proto";
import "raptor/v1/relay.proto";

/***************** User Command API *****************/

message UserRequest {
  // request message multiplexor
  oneof request_mux {
    DeviceMetadataRequest device_metadata = 1;
    DeviceAliveTelemetryRequest alive = 2;
    DeviceResetResponse reset = 3;
    DeviceEstopRequest estop = 4;
  }
}

message UserResponse {
  // response message multiplexor
  oneof response_mux {
    DeviceMetadataResponse device_metadata = 1;
    DeviceAliveTelemetryResponse alive = 2;
    DeviceResetResponse reset = 3;
    DeviceEstopResponse estop = 4;
  }
}

/***************** Root Command API *****************/

enum RootStatus {
  // reserved
  ROOT_STATUS_UNSPECIFIED = 0;

  // authenticated
  ROOT_STATUS_OK = 1;
  // unauthorized; verify root key
  ROOT_STATUS_UNAUTHORIZED = 2;
}

message RootRequest {
  // root authentication key
  uint32 key = 1;
  // request message multiplexor
  oneof request_mux {
    RelayControlRequest relay_control = 2;
    RegisterReadRequest register_read = 3;
    RegisterWriteRequest register_write = 4;
    RegisterNvmRequest register_nvm = 5;
  }
}

message RootResponse {
  // response message multiplexor
  oneof response_mux {
    RelayControlResponse relay_control = 1;
    RegisterReadResponse register_read = 2;
    RegisterWriteResponse register_write = 3;
    RegisterNvmResponse register_nvm = 4;
  }
}
