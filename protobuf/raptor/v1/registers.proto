syntax = "proto3";

package raptor.v1;

enum RegisterId {
  // reserved
  REGISTER_ID_UNSPECIFIED = 0;
}

/***************** Register API *****************/

message RegisterWriteRequest {
  RegisterId id = 1;
  sint64 value = 2;
}

message RegisterWriteResponse {}

message RegisterReadRequest {
  RegisterId id = 1;
}

message RegisterReadResponse {
  RegisterId id = 1;
  sint64 value = 2;
}

enum RegisterNvmAction {
  // reserved
  REGISTER_NVM_ACTION_UNSPECIFIED = 0;

  // flash in-memory registers to NVM
  REGISTER_NVM_ACTION_SAVE = 1;
  // load registers from NVM to in-memory registers. This will overwrite any existing in-memory registers
  REGISTER_NVM_ACTION_LOAD = 2;
}

message RegisterNvmRequest {
  RegisterNvmAction action = 1;
}

message RegisterNvmResponse {}
