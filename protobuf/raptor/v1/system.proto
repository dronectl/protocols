syntax = "proto3";

package raptor.v1;

enum SystemStatus {
  SYSTEM_STATUS_UNSPECIFIED = 0;
  SYSTEM_STATUS_IDLE = 1;
  SYSTEM_STATUS_ARMED = 2;
  SYSTEM_STATUS_ACTIVE = 3;
  SYSTEM_STATUS_INERROR = 4;
}

message SystemMetadata {
  int32 uuid = 1;
  string firmware_version = 2;
  string hardware_version = 3;
}
