syntax = "proto3";

package raptor.v1;

enum RelayId {
  // reserved
  RELAY_ID_UNSPECIFIED = 0;

  // power train relay
  RELAY_ID_POWERTRAIN = 1;
  // battery relay
  RELAY_ID_BATTERY = 2;
  // auxiliary power relay
  RELAY_ID_AUX = 3;
}

enum RelayState {
  // reserved
  RELAY_STATE_UNSPECIFIED = 0;

  RELAY_STATE_OPENED = 1;
  RELAY_STATE_CLOSED = 2;
}

enum RelayCommand {
  // reserved
  RELAY_COMMAND_UNSPECIFIED = 0;

  RELAY_COMMAND_OPEN = 1;
  RELAY_COMMAND_CLOSE = 2;
}

message RelayTelemetry {
  // array of relay states indexed by RelayId
  repeated RelayState relay_states = 1;
}

/***************** Relay Control API *****************/

message RelayControlRequest {
  RelayId id = 1;
  RelayCommand command = 2;
}

message RelayControlResponse {}
