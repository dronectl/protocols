syntax = "proto3";

package raptor.v1;

message EnvironmentData {
  float humidity = 1; // Relative humidity in (%)
  float pressure = 2; // ambient pressure (HPa)
  float temperature = 3; // ambient temperature (˚C)
}

message ConditionsData {
  EnvironmentData environment = 1;
  float bldc_temperature = 2;
  float battery_temperature = 3;
  float esc_temperature = 4;
  float aux_1_temperature = 5;
  float aux_2_temperature = 6;
}
