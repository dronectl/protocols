syntax = "proto3";

package raptor.v1;

message Ambient {
  float humidity = 1;
  float pressure = 2;
  float temperature = 3;
}

message EnvironmentMeasurements {
  Ambient ambient = 1;
  float bldc_temperature = 2;
  float battery_temperature = 3;
  float esc_temperature = 4;
  float aux_1_temperature = 5;
  float aux_2_temperature = 6;
}
